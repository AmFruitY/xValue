services:

  # ── MinIO object store ────────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: xvalue-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3-compatible API  →  http://localhost:9000
      - "9001:9001"   # Web console UI     →  http://localhost:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── One-shot container: creates the bucket on first startup ───────────────
  createbuckets:
    image: quay.io/minio/mc:latest
    container_name: xvalue-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/$${MINIO_BUCKET};
        mc anonymous set download local/$${MINIO_BUCKET};
        echo '✓ Bucket $${MINIO_BUCKET} is ready';
      "
    restart: on-failure

volumes:
  minio_data:
    driver: local
